name: Update FPL data

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch FPL data
        run: |
          mkdir -p data
          curl -sfL -A "Mozilla/5.0" \
            "https://fantasy.premierleague.com/api/bootstrap-static/" -o data/bootstrap.json
          curl -sfL -A "Mozilla/5.0" \
            "https://fantasy.premierleague.com/api/fixtures/" -o data/fixtures.json
          python3 -c "import json; json.load(open('data/bootstrap.json')); json.load(open('data/fixtures.json'))"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bootstrap.json data/fixtures.json
          if git diff --cached --quiet; then
            echo "No changes in FPL data."
          else
            git commit -m "Update FPL data"
            git push
          fi
